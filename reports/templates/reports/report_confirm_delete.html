{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Delete Report - CityWatch</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
"colors": {
"primary": "#002045", "on-primary": "#ffffff", "error": "#ba1a1a", "on-error": "#ffffff",
"error-container": "#ffdad6", "surface": "#f7fafc", "on-surface": "#181c1e",
"on-surface-variant": "#43474e", "surface-container-lowest": "#ffffff",
"outline": "#74777f", "outline-variant": "#c4c6cf", "background": "#f7fafc"
},
"borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"}
}}}
</script>
<style>.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }</style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-6">

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 max-w-md w-full text-center">
<div class="w-16 h-16 rounded-full bg-error-container text-error flex items-center justify-center mx-auto mb-4">
<span class="material-symbols-outlined text-3xl">delete</span>
</div>
<h1 class="text-xl font-semibold text-on-surface mb-2">Delete this report?</h1>
<p class="text-on-surface-variant mb-6">
Are you sure you want to delete <strong>"{{ report.title }}"</strong>? This action cannot be undone.
</p>

<form method="POST" class="flex gap-3 justify-center">
{% csrf_token %}
<a href="{% url 'report_detail' report.id %}" class="px-6 py-2 border border-outline-variant rounded-lg text-on-surface hover:bg-surface transition-colors text-sm font-semibold">
Cancel
</a>
<button type="submit" class="px-6 py-2 bg-error text-on-error rounded-lg hover:opacity-90 transition-colors text-sm font-semibold">
Yes, Delete
</button>
</form>
</div>

</body>
</html>
